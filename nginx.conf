server {
    listen 80;
    server_name _;
    absolute_redirect off;
    port_in_redirect off;
    
    root /usr/share/nginx/html;
    index index.html;
    
    # Serve static frontend
    location /e-memo-job-reservation/ {
        alias /usr/share/nginx/html/e-memo-job-reservation/;
        try_files $uri $uri/ /e-memo-job-reservation/index.html;
        index index.html;
    }
    
    # Cache static assets
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Proxy API
    location /api/e-memo-job-reservation/ {
        proxy_pass http://job_reservation_api:8080/api/e-memo-job-reservation/;
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_cache_bypass $http_upgrade;
    }
}